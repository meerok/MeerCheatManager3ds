name: Build McM3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so every build uses the same cheat codes. Bump these to pull in new Sharkive codes.
  SHARKIVE_COMMIT: aeab5fd3b001ed22c013efd1a02b092575d825ed
  SHARKIVE_WIKI_COMMIT: 7da31f88e36d151c7c22d0ec88c9da07cc2f4e7b

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Sharkive and its game list
        run: |
          git clone -q https://github.com/FlagBrew/Sharkive.git sharkive
          git -C sharkive checkout -q "$SHARKIVE_COMMIT"
          git clone -q https://github.com/FlagBrew/Sharkive.wiki.git sharkive-wiki
          git -C sharkive-wiki checkout -q "$SHARKIVE_WIKI_COMMIT"

      - name: Build cheat database
        run: python3 tools/build_db.py sharkive sharkive-wiki

      - uses: actions/upload-artifact@v4
        with:
          name: database
          path: Data/builtin.bin

  build:
    needs: database
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: database
          path: Data

      - name: Build plugin
        shell: bash
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: McM3
          path: |
            build.log
            McM3.3gx
          if-no-files-found: warn

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McM3
          path: out

      - name: Push result to build-output branch
        run: |
          cd out
          echo "status: ${{ needs.build.result }}" > STATUS.txt
          echo "commit: ${{ github.sha }}" >> STATUS.txt
          git init -q
          git config user.name "McM3 CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b build-output
          git add -A
          git commit -q -m "Build ${{ github.sha }} (${{ needs.build.result }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output
